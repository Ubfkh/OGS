<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
        <title>Ejercicio 13 - DOM básico y atributos XHTML</title>

        <script type="text/javascript">
            
        </script>
    </head>

    <body>

        <ul id="lista">
            <li>Lorem ipsum dolor sit amet</li>
            <li>Consectetuer adipiscing elit</li>
            <li>Sed mattis enim vitae orci</li>
            <li>Phasellus libero</li>
            <li>Maecenas nisl arcu</li>
        </ul>

        <input type="button" id="btAnade" value="Añadir elemento" onclick="anade()">

        <script>
            function anade() {
                let lista = document.getElementById('lista');

                let nuevo = document.createElement('li');

                nuevo.textContent = "OIBHOUB";

                lista.appendChild(nuevo);
            }
        </script>
    </body>
</html>
