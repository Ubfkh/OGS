<!DOCTYPE html>
	<head>
		<meta charset="UTF-8"/>
		<title>Validar Formularios</title>
		<style type="text/css">
			span {
				color: red;
			}
			
		</style>
		<script src="Utilidades.js"></script>
		<script>

			function comprobar (){

				//creamos un booleano que si es true enviará el formulario, si es false no
				let ok = true;

				//cogemos la longitud del nombre y la comprobamos
				let longNombre = document.getElementById('nombre').value;
				longNombre = longNombre.length;
				
				//Si la longitud es menor que 2, saltamos el error, si no, pues no
				const span1 = document.getElementById('info_nombre');
				if (longNombre < 2){
					span1.textContent = "El mínimo es 2 caracteres, lo pone ahí, lee un poco, porfa";
					ok = false;
				} else {
					span1.textContent = " ";
				}

				//apellido
				const longApell = document.getElementById('apellidos').value.length;
				const span5 = document.getElementById('info_apellidos');
				if (longApell < 4){
					span5.textContent = "El mínimo es 4 caracteres ¿No sabes leer?";
					ok = false;
				} else {
					span5.textContent = " ";
				}


				//cogemos el dni y lo comprobamos
				const dni = document.getElementById('dni').value;

				const span2 = document.getElementById('info_dni');
				//Comparamos el texto introducido por el usuario con el formato
				const regexDNI = /^[0-9]{8}[A-Z]$/;
				if (!regexDNI.test(dni)){
					span2.textContent = "Formato incorrecto, un DNI siempre tiene 8 números y una letra, mira el tuyo y lo descubrirás";
					ok = false;
				} else{
					span2.textContent = ' ';
				}

				//fecha
				const dia = Number(document.getElementById('f_dia').value);
				const mes = Number(document.getElementById('f_mes').value) - 1;
				const ano = Number(document.getElementById('f_ano').value);

				let fecha = new Date(ano, mes, dia);

				const span6 = document.getElementById('info_fecha');
				if (fecha.getFullYear() == ano && fecha.getMonth() == mes && fecha.getDate() == dia){
					span6.textContent = ' ';
				} else {
					span6.textContent = 'La fecha no existe, ponla bien, que si no no sirve';
					ok = false;
				}
				
				//sugerencia
				const sug = document.getElementById('sugerencia').value;

				const span4 = document.getElementById('info_sugerencia');
				if (sug == ''){
					span4.textContent = 'Porfa, sugiere algo, que si no me aburro';
					ok = false;
				} else {
					span4.textContent = ' ';
				}

				//sexo
				const f = document.getElementById('femenino');
				const m = document.getElementById('masculino');
				const n = document.getElementById('ni_me_acuerdo');
				const span7 = document.getElementById('info_sexo');
				if (f.checked || m.checked){
					span7.textContent = ' ';
				} else if (n.checked){
					span7.textContent = 'Yo tampoco tengo, te acompaño en el sentimiento :('
				} else {
					span7.textContent = 'Selecciona una, mira que te lo he puesto clarito para que veas que hay que seleccionar una opción';
					ok = false;
				}

				//estatura
				const estatura = document.getElementById('estatura').value;
				const span11 = document.getElementById('info_estatura');
				if (estatura == ""){
					span11.textContent = '¿Acaso no mides? Pon un número aunque sea falso'
					ok = false;
				} else {
					span11.textContent = ' ';
				}

				//estado civil
				const estadoCivil = document.getElementById('estado_civil').value;
				const span8 = document.getElementById('info_estado_civil');

				if (estadoCivil == '-1'){
					span8.textContent = 'Elige una opción, si ya has tenido que ver seleccionadores así, sabes cómo va'
					ok = false;
				} else {
					span8.textContent = ' ';
				}


				//cerveza
				const cajitas = document.getElementsByName('bebidas');
				let cant = 0;

				for (let i=0; i < cajitas.length; i++){
					if (cajitas[i].checked)
						cant++
				}

				const span9 = document.getElementById('info_bebidas');
				if (cant < 3){
					span9.textContent = 'Mira, te pone claramente MINIMO 3 OPCIONES';
					ok = false;
				} else {
					span9.textContent = ' ';
				}

				//banco
				const nCCC = document.getElementById('ccc').value;
				const regexCCC = /^[0-9]{20}$/
				const span10 = document.getElementById('info_ccc');
				if (!regexCCC.test(nCCC)){
					span10.textContent = 'Mira aquí no te culpo porque a mí también me pasaría, pero cópialo bien, anda'
					ok = false;
				} else {
					span10.textContent = ' ';
				}

				return ok;
			}	
			
			function limpiar () {
				let spans = document.getElementsByTagName('span');
				for (let i=0; i < spans.length; i++)
					spans[i].textContent = ' ';
			}
			
		</script>
	</head>

	<body>

		<h1>Ejercicio Validación de Formularios</h1>
		<form id="formulario_1" onsubmit="return comprobar()" onreset="limpiar()">
		<p>
			<h3>Formulario de Registro:</h3>
			<label for="nombre">Nombre: </label>
			<input type="text" name="nombre" id="nombre" maxlength="25" size="15" />
			<span id="info_nombre"></span>
			<div>(Mínimo 2 letras)</div>
			<br><br>
			
			<label for="apellidos">Apellidos: </label>
			<input type="text" name="apellidos" id="apellidos" maxlength="50" size="25" />
			<span id="info_apellidos"></span>
			<div>(Mínimo 4 letras)</div>
			<br><br>
			
			<label for="dni">NIF: </label>
			<input type="text" name="dni" id="dni" maxlength="9" size="9" />
			<span id="info_dni"></span>
			<br><br><br>
			
      		
			
			<label>Sexo: </label>
      <input type="radio" name="sexo" id="femenino" value="femenino" />
      <label for="femenino">Femenino</label>
			<input type="radio" name="sexo" id="masculino" value="masculino" />
			<label for="masculino">Masculino</label>
			<input type="radio" name="sexo" id="ni_me_acuerdo" value="ni_me_acuerdo" />
			<label for="ni_me_acuerdo">hace tanto que ni me acuerdo</label>
      <span id="info_sexo"></span>
			<br><br><br>
			
			
			
			<label for="f_dia">Fecha: </label>
      <input type="text" id="f_dia" maxlength="2" size="1" /> / 
      <input type="text" id="f_mes" maxlength="2" size="1" /> / 
      <input type="text" id="f_ano" maxlength="4" size="3" /> (dd/mm/aaaa) 
      <span id="info_fecha"></span>
      <br><br><br>
			
			
			
			<label for="estatura">Estatura (en metros): </label>
			<input type="text" id="estatura" size="5" maxlength="7"> 
			<span id="info_estatura"></span>
			<br><br><br>
			
			
			<label for="estado_civil">Estado Civil: </label>
      <select id="estado_civil">
      	<option value="-1">Selecciona una opción</option>
      	<option value="1">Soltera/o</option>
      	<option value="2">Casada/o</option>
      	<option value="3">Separada/o</option>
      	<option value="4">Divorciada/o</option>
      	<option value="5">Pareja de hecho</option>
      	<option value="6">En la gloria</option>
      	<option value="7">Es complicado!!!!</option>
      </select> 
			<span id="info_estado_civil"></span>
      <br><br><br>
			
			
			<div>Preferencias en zumos de cebada: </div>
			
			<ul>
				<li>
					<input type="checkbox" name="bebidas" value="paulaner" />
					<label>Paulaner</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="coronita" />
					<label>Coronita</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="cruzcampo" />
					<label>Cruzcampo</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="desperados" />
					<label>Desperados</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="grimbergen" />
					<label>Grimbergen optimo bruno</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="judas" />
					<label>Judas</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="lucifer" />
					<label>Lucifer</label>
				</li>
				<li>
					<input type="checkbox" name="bebidas" value="ambar" />
					<label>Ambar Export</label>
				</li>
			</ul>
      <span id="info_bebidas"></span>
			<div>(Mínimo 3 opciones)</div>
      <br><br>
			
			
			<label for="ccc">Número Cuenta Corriente: </label>
			<input type="text" name="ccc" id="ccc" maxlength="20" size="22" /> 
      <span id="info_ccc"></span>
			<div>(20 dígitos sin blancos)</div>
			<br><br><br>
			
      
      <label for="sugerencia">Alguna sugerencia: </label>
      <textarea id="sugerencia" name="sugerencia"></textarea>
			<span id="info_sugerencia"></span>
      <br><br>
		</p>
		<p><b>Todos los campos son obligatorios.</b></p>
		<br>
		<p>
			<input type="submit" value="ENVIAR" >
			<br><br>
			<input type="reset" value="Limpiar">
			
		</p>
		</form>
	</body>
</html>
